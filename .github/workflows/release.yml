name: Release

on:
  # a tag pushed by hand
  push:
    tags:
      - 'v*'
  # the tag Auto Tag just pushed
  workflow_call:
    inputs:
      tag:
        description: the version tag to release
        required: true
        type: string

permissions: {}

jobs:
  build:
    # trusted builder: signs attestations, cannot write to the repo
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish:
    # publisher: creates the release, cannot sign attestations
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${TAG}"
          -R "${GITHUB_REPOSITORY}"
          --verify-tag
          --title "${TAG}"
          --generate-notes
          "llingr-pgx_${TAG}.tar.gz"
          "llingr-pgx_${TAG}.tar.gz.sigstore"
          "llingr-pgx_${TAG}.cdx.json"
          "llingr-pgx_${TAG}.spdx.json"
