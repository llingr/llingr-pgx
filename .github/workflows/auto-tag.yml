name: Auto Tag

on:
  push:
    branches:
      - main

permissions: {}

# Serialise runs so two quick merges cannot compute the same next version.
concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    # Computes the next version from conventional commit subjects since the
    # last v* tag (feat -> minor, fix, perf or docs -> patch) and pushes the
    # tag; with only ci, build, test or chore commits since it, none is pushed.
    # The first tag is v0.1.0. Before v1 a breaking change bumps the minor
    # version, as v0 promises no compatibility; from v1 major bumps are manual,
    # as a new Go major changes the module path (/v2).
    name: push version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute and push next tag
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            next="v0.1.0"
            bump="first"
          else
            if [ "$(git rev-list -n1 "$last")" = "$GITHUB_SHA" ]; then
              echo "no commits since $last; nothing to tag"
              exit 0
            fi
            subjects=$(git log --format=%s "$last..$GITHUB_SHA")
            # ci, build, test and chore change nothing a user fetches, so they wait for the
            # next feat, fix, perf, docs or breaking commit to go out with
            if ! echo "$subjects" | grep -qE \
              '^(feat|fix|perf|docs)(\(.+\))?!?:|^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
              echo "no feat, fix, perf, docs or breaking commit since $last; nothing to tag"
              exit 0
            fi
            version="${last#v}"
            maj="${version%%.*}"; rest="${version#*.}"
            min="${rest%%.*}"; pat="${rest#*.}"
            bump="patch"
            echo "$subjects" | grep -qE '^feat(\(.+\))?:' && bump=minor
            if echo "$subjects" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
              if [ "$maj" -ne 0 ]; then
                echo "breaking change detected: major bumps are manual in Go (module path changes)"
                exit 1
              fi
              bump=minor
            fi
            case "$bump" in
              minor) min=$((min + 1)); pat=0 ;;
              patch) pat=$((pat + 1)) ;;
            esac
            next="v${maj}.${min}.${pat}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "$next" "$GITHUB_SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "tagged $next (previous: ${last:-none}, bump: $bump)"

  release:
    # A tag pushed with the workflow's own token starts no other workflow, so
    # the release runs here, for the tag just pushed, with no personal token.
    # A tag pushed by hand starts release.yml itself.
    name: Release
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
